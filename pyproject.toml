[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-suite"
version = "0.0.1"
description = "Unified computer vision toolkit with shared FM runtime and branch-owned I/O."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Tonso", email = "ptonso@gmail.com" }]
keywords = ["computer-vision", "dataset", "annotation", "foundation-models", "cli", "yolo", "coco"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "pillow>=9.5",
  "imagehash>=4.3",
  "opencv-python>=4.8",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6",
  "mypy>=1.7",
]

[project.urls]
Homepage = "https://github.com/ptonso/cv-suite"
Repository = "https://github.com/ptonso/cv-suite"
Issues = "https://github.com/ptonso/cv-suite/issues"

[project.scripts]
cvsuite = "cvsuite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cvsuite*"]

[tool.setuptools.package-data]
cvsuite = ["common/fm/providers/setup_venv/*.sh"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
pythonpath = ["src"]
